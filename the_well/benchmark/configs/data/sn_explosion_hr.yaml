_target_: the_well.data.WellDataModule
# ── Data location ─────────────────────────────────────────────────────────────
# Relative to the_well/benchmark/ (where train.py is run).
# Use an absolute path if the datasets/ folder is elsewhere.
well_base_path: ../../datasets/
well_dataset_name: sn_explosion_hr
# ── Batch & normalization ─────────────────────────────────────────────────────
batch_size: 4
use_normalization: True
normalization_type:
  _partial_: true
  _target_: the_well.data.normalization.ZScoreNormalization
# ── Temporal setup ────────────────────────────────────────────────────────────
# T=2 dataset: one input snapshot (t0), one output snapshot (t0+20 Myr).
# dim_in  = n_steps_input  × n_fields = 1 × 2 = 2
# dim_out = n_fields = 2
n_steps_input: 1
n_steps_output: 1
min_dt_stride: 1
max_dt_stride: 1
