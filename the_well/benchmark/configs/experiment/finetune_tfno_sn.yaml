# @package _global_
defaults:
  - /data: sn_explosion_hr
  - /model: tfno
  - /lr_scheduler: cosine_with_warmup

# Override global defaults from config.yaml (which sets n_steps_input: 4)
data:
  n_steps_input: 1
  n_steps_output: 1

trainer:
  loss_fn:
    _target_: the_well.benchmark.metrics.MSE
  formatter: channels_first_default
  epochs: 100
  val_frequency: 1
  rollout_val_frequency: 0
  checkpoint_frequency: 10

name: finetune_sn
